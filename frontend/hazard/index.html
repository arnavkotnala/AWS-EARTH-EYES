<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hazard Lens</title>
  <meta name="description" content="Click anywhere on Earth: Gemma 4 reads the satellite image together with river, flood, terrain, rain and soil data and returns a hazard assessment." />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛰️</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root {
      --bg: #050811;
      --surface: #0a0f1d;
      --surface-2: #111a2e;
      --border: rgba(255, 255, 255, 0.10);
      --text: #f8fafc;
      --muted: #94a3b8;
      --dim: #64748b;
      --accent: #38bdf8;
      --forest: #10b981;
      --lvl-low: #22c55e;
      --lvl-moderate: #eab308;
      --lvl-high: #f97316;
      --lvl-very_high: #ef4444;
      --sans: 'Inter', -apple-system, 'Segoe UI', Roboto, sans-serif;
      --head: 'Outfit', var(--sans);
      --mono: 'JetBrains Mono', ui-monospace, monospace;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { background: var(--bg); color: var(--text); font: 14px/1.5 var(--sans); display: flex; overflow: hidden; }

    #map { flex: 1; height: 100%; }
    .leaflet-container { background: #0b1220; }

    aside {
      width: 440px; max-width: 100%; height: 100%; overflow-y: auto;
      background: var(--surface); border-left: 1px solid var(--border);
      padding: 18px 18px 40px;
    }
    h1 { font: 800 20px/1.2 var(--head); margin: 0; letter-spacing: .02em; }
    .sub { color: var(--muted); margin: 4px 0 14px; font-size: 13px; }
    .badge-gemma {
      display: inline-flex; gap: 6px; align-items: center; font: 600 11px var(--mono);
      padding: 3px 8px; border-radius: 999px; border: 1px solid rgba(56,189,248,.4); color: var(--accent);
    }

    form { display: flex; gap: 6px; margin: 12px 0 8px; }
    input[type=search] {
      flex: 1; background: var(--surface-2); color: var(--text); border: 1px solid var(--border);
      border-radius: 8px; padding: 9px 11px; font: inherit;
    }
    button {
      background: var(--accent); color: #04121c; border: 0; border-radius: 8px; padding: 9px 14px;
      font: 600 13px var(--sans); cursor: pointer;
    }
    button:disabled { opacity: .5; cursor: wait; }
    .presets { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
    .presets button { background: var(--surface-2); color: var(--muted); border: 1px solid var(--border); padding: 5px 9px; font-weight: 500; font-size: 12px; }
    .presets button:hover { color: var(--text); }

    .hint { color: var(--dim); font-size: 13px; border: 1px dashed var(--border); border-radius: 10px; padding: 14px; }

    .card { background: var(--surface-2); border: 1px solid var(--border); border-radius: 12px; padding: 14px; margin-top: 12px; }
    .card h2 { font: 700 12px var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; }
    .headline { font: 600 16px/1.35 var(--head); margin: 6px 0 0; }
    .lvl { display: inline-block; font: 700 11px var(--mono); text-transform: uppercase; padding: 2px 8px; border-radius: 6px; color: #0b0b0b; }
    .lvl.low { background: var(--lvl-low); } .lvl.moderate { background: var(--lvl-moderate); }
    .lvl.high { background: var(--lvl-high); } .lvl.very_high { background: var(--lvl-very_high); color: #fff; }

    .hz { border-top: 1px solid var(--border); padding: 10px 0 2px; }
    .hz:first-of-type { border-top: 0; padding-top: 0; }
    .hz-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .hz-name { font-weight: 600; text-transform: capitalize; }
    .hz p { margin: 6px 0 0; color: var(--muted); font-size: 13px; }
    .hz b { color: var(--text); font-weight: 600; }
    .conf { color: var(--dim); font: 11px var(--mono); }

    ul { margin: 0; padding-left: 18px; } li { margin: 3px 0; }
    .meta { color: var(--dim); font: 11px/1.5 var(--mono); margin-top: 10px; }

    table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
    td { padding: 4px 0; vertical-align: top; border-bottom: 1px solid rgba(255,255,255,.05); }
    td:first-child { color: var(--muted); padding-right: 10px; white-space: nowrap; }
    td:last-child { text-align: right; font-family: var(--mono); }
    .src { color: var(--dim); font-size: 11px; margin: 2px 0 10px; }

    .loading { display: flex; gap: 10px; align-items: center; color: var(--muted); }
    .spinner { width: 16px; height: 16px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .err { color: #fca5a5; }
    .view-switch { display: flex; background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; padding: 3px; gap: 3px; margin-top: 4px; }
    .view-switch[hidden] { display: none; }
    .view-switch button { flex: 1; background: transparent; color: var(--muted); padding: 7px; font-weight: 600; }
    .view-switch button[aria-selected="true"] { background: var(--accent); color: #04121c; }
    #out.data-only .reading-card { display: none; }
    .source-tag { display: inline-flex; align-items: center; gap: 6px; font: 600 11px var(--mono); padding: 3px 8px; border-radius: 6px; margin-bottom: 8px; }
    .source-tag.gemma { color: var(--accent); background: rgba(56,189,248,.12); }
    .source-tag.backup { color: #94a3b8; background: rgba(148,163,184,.12); }
    .source-tag.rules { color: #94a3b8; background: rgba(148,163,184,.12); }
    .retry { margin-top: 10px; background: transparent; color: var(--accent); border: 1px solid rgba(56,189,248,.5); padding: 6px 10px; }
    .err a { color: var(--accent); } .err code { font-family: var(--mono); color: var(--text); }

    @media (max-width: 760px) {
      body { flex-direction: column; overflow: auto; }
      #map { height: 45vh; flex: none; }
      aside { width: 100%; height: auto; border-left: 0; border-top: 1px solid var(--border); padding: 16px; }
    }
  </style>
</head>
<body>
  <div id="map" role="application" aria-label="World map: click a place to assess it"></div>

  <aside>
    <h1>🛰️ Hazard Lens</h1>
    <p class="sub">Click anywhere on Earth. Gemma 4 looks at the satellite image <i>and</i> live river, flood, terrain, rain and soil data, then explains the natural hazards there.</p>
    <span class="badge-gemma">✦ Powered by Gemma 4</span>

    <form id="search">
      <input type="search" id="q" placeholder="Search a place (e.g. Joshimath)" aria-label="Search a place" />
      <button type="submit">Go</button>
    </form>
    <div class="presets" id="presets"></div>

    <div class="view-switch" id="view-switch" role="tablist" aria-label="What to show" hidden>
      <button type="button" role="tab" data-view="reading" aria-selected="true">✦ Reading</button>
      <button type="button" role="tab" data-view="data" aria-selected="false">📊 Data only</button>
    </div>
    <div id="out"><div class="hint">👆 Pick a demo place above, search, or click the map.</div></div>

  </aside>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    'use strict';
    // Demo places follow the Forest / River toggle of the main app (?mode=forest|river).
    const PRESETS = {
      river: [
        { name: 'Joshimath, Chamoli (India)', lat: 30.555, lon: 79.565 },
        { name: 'Rhine at Cologne (Germany)', lat: 50.94, lon: 6.96 },
        { name: 'Amazon near Manaus (Brazil)', lat: -3.13, lon: -59.95 },
        { name: 'Derna, Libya (2023 dam failure)', lat: 32.76, lon: 22.64 },
        { name: 'Sindh, Indus (Pakistan)', lat: 26.2, lon: 68.37 },
      ],
      // Chosen because UMD/Hansen shows real natural-forest loss 2021-24 in the 10 km box
      forest: [
        { name: 'Lábrea, Amazonas (Brazil)', lat: -7.6, lon: -64.6 },
        { name: 'Novo Progresso, Pará (Brazil)', lat: -7.1, lon: -55.4 },
        { name: 'Porto Velho, Rondônia (Brazil)', lat: -9.2, lon: -64.4 },
        { name: 'São Félix do Xingu, Pará (Brazil)', lat: -6.6, lon: -52.3 },
        { name: 'Riau, Sumatra (Indonesia)', lat: -0.2, lon: 101.95 },
      ],
    };
    let mode = new URLSearchParams(location.search).get('mode') === 'forest' ? 'forest' : 'river';

    const map = L.map('map', { worldCopyJump: true, zoomControl: false }).setView([25, 20], 3);
    L.control.zoom({ position: 'bottomleft' }).addTo(map);
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      maxZoom: 18, attribution: 'Imagery © Esri, Maxar, Earthstar Geographics',
    }).addTo(map);
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', {
      maxZoom: 18, opacity: 0.8,
    }).addTo(map);
    const layer = L.layerGroup().addTo(map);

    const out = document.getElementById('out');
    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const fmt = (v, unit = '') => (v === null || v === undefined ? '—' : `${typeof v === 'number' ? v.toLocaleString() : esc(v)}${unit}`);
    const HAZARD_NAMES = {
      flood: '🌊 Flood', landslide: '⛰️ Landslide', debris_flow: '🪨 Debris flow', erosion_sediment: '🟫 Erosion & sediment',
      deforestation: '🌳 Deforestation', drought_low_flow: '☀️ Drought / low flow', glacial: '🧊 Glacial', other: '⚠️ Other',
    };
    const levelText = l => esc(String(l || '').replace('_', ' '));

    function showPresets() {
      document.getElementById('presets').replaceChildren(...PRESETS[mode].map(p => {
        const b = document.createElement('button');
        b.type = 'button'; b.textContent = p.name;
        b.onclick = () => assess(p.lat, p.lon, p.name);
        return b;
      }));
    }
    showPresets();
    // The main app tells us when the user switches Forest / River
    window.addEventListener('message', e => {
      if (e.origin !== location.origin || e.data?.type !== 'hazard-mode') return;
      if (e.data.mode !== mode && PRESETS[e.data.mode]) { mode = e.data.mode; showPresets(); }
    });

    // Inside the main app's overlay: let Esc close it.
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape' && window.parent !== window) window.parent.postMessage({ type: 'close-hazard-lens' }, location.origin);
    });

    map.on('click', e => assess(e.latlng.lat, ((e.latlng.lng + 540) % 360) - 180));

    document.getElementById('search').addEventListener('submit', async e => {
      e.preventDefault();
      const q = document.getElementById('q').value.trim();
      if (!q) return;
      try {
        const r = await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=1&q=${encodeURIComponent(q)}`);
        const [hit] = await r.json();
        if (!hit) { out.innerHTML = `<div class="card err">No place found for “${esc(q)}”.</div>`; return; }
        assess(+hit.lat, +hit.lon, hit.display_name.split(',').slice(0, 2).join(','));
      } catch { out.innerHTML = '<div class="card err">Search is unavailable right now. Click the map instead.</div>'; }
    });

    // The API lives in our Node server: opening this file directly (file://, Live Server…) can't reach it.
    const SERVER_HINT = location.protocol === 'file:'
      ? 'The Hazard Lens needs the project server: in the project folder run <code>npm start</code>, then open <a href="http://localhost:8080/" target="_top">http://localhost:8080</a>.'
      : 'The server did not answer. Wait a moment and try again (a sleeping free server can take about a minute to wake up).';
    if (location.protocol === 'file:') {
      out.innerHTML = `<div class="card err">⚠️ This page was opened as a file. ${SERVER_HINT}</div>`;
    }

    let busy = false;
    let lastPlace = null;
    let view = 'reading';
    const viewSwitch = document.getElementById('view-switch');
    viewSwitch.addEventListener('click', e => {
      const b = e.target.closest('button[data-view]');
      if (!b) return;
      view = b.dataset.view;
      viewSwitch.querySelectorAll('button').forEach(x => x.setAttribute('aria-selected', String(x === b)));
      out.classList.toggle('data-only', view === 'data');
    });

    async function assess(lat, lon, name) {
      lastPlace = { lat, lon, name };
      if (busy) return;
      if (location.protocol === 'file:') {
        out.innerHTML = `<div class="card err">⚠️ This page was opened as a file. ${SERVER_HINT}</div>`;
        return;
      }
      busy = true;
      document.querySelectorAll('button').forEach(b => (b.disabled = true));
      layer.clearLayers();
      L.circleMarker([lat, lon], { radius: 7, color: '#fff', weight: 2, fillColor: '#38bdf8', fillOpacity: 1 }).addTo(layer);
      map.flyTo([lat, lon], Math.max(map.getZoom(), 11), { duration: 1.2 });

      const steps = ['Fetching satellite image…', 'Reading terrain, rain and river flow…', 'Tracing the river downstream…', 'Gemma 4 is reading the image and data…', 'Gemma 4 is still thinking (free API can be slow)…'];
      let s = 0;
      out.innerHTML = `<div class="card loading"><div class="spinner"></div><span id="step">${steps[0]}</span></div>`;
      const timer = setInterval(() => { s = Math.min(s + 1, steps.length - 1); const el = document.getElementById('step'); if (el) el.textContent = steps[s]; }, 6000);

      try {
        const res = await fetch('/api/v1/hazard', {
          method: 'POST', headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ lat, lon, name, focus: mode }), signal: AbortSignal.timeout(150000),
        });
        const r = await res.json().catch(() => {
          throw new Error(res.status === 404 || res.status === 405
            ? `this server has no Hazard Lens API (HTTP ${res.status}). Restart it with the latest code.`
            : `the server sent an unexpected reply (HTTP ${res.status}).`);
        });
        if (!res.ok) throw new Error(r.error || `HTTP ${res.status}`);
        draw(r);
      } catch (err) {
        const msg = err.name === 'TimeoutError'
          ? 'the server took longer than 2.5 minutes. Try again.'
          : /failed to fetch|networkerror|load failed/i.test(err.message)
            ? `could not reach the server. Is it still running? ${SERVER_HINT}`
            : esc(err.message);
        out.innerHTML = `<div class="card err">Could not assess this place: ${msg}</div>`;
      } finally {
        clearInterval(timer);
        busy = false;
        document.querySelectorAll('button').forEach(b => (b.disabled = false));
      }
    }

    function draw(r) {
      if (r.image?.bbox) {
        const [w, s, e, n] = r.image.bbox;
        L.rectangle([[s, w], [n, e]], { color: '#38bdf8', weight: 1, fill: false, dashArray: '4 4' }).bindTooltip('Area Gemma 4 looked at').addTo(layer);
      }
      if (r.riverPath?.length > 1) {
        L.polyline(r.riverPath, { color: '#22d3ee', weight: 4, opacity: 0.9 })
          .bindTooltip('River downstream (300 km, HydroRIVERS)').addTo(layer);
      }

      const d = r.data || {};
      const t = d.terrain, rain = d.rainfall, f = d.river_flow_forecast, rv = d.nearest_river;
      let html = '';

      const a = r.reading;
      const SOURCE = {
        gemma: `<span class="source-tag gemma">✦ Gemma 4 reading · ${esc(r.model)} via ${r.provider === 'bedrock' ? 'Amazon Bedrock' : 'Google AI Studio'}</span>`,
        backup: `<span class="source-tag backup">✦ AI reading</span>`,
        rules: `<span class="source-tag rules">Reading from the data</span>`,
      };
      html += `<div class="card reading-card">
        ${SOURCE[r.readingSource] || ''}
        <h2>${esc(r.place)}</h2>
        <span class="lvl ${esc(a.overall_level)}">Overall: ${levelText(a.overall_level)}</span>
        <p class="headline">${esc(a.headline)}</p>
        <div class="meta">${(r.tookMs / 1000).toFixed(0)} s${r.aiError ? ` · AI error: ${esc(r.aiError)}` : ''}</div>
        ${r.readingSource !== 'gemma' ? '<button type="button" class="retry" id="retry">↻ Retry with Gemma 4</button>' : ''}
      </div>`;
      if (a.hazards.length) {
        html += `<div class="card reading-card"><h2>Hazards</h2>${a.hazards.map(h => `
          <div class="hz">
            <div class="hz-top"><span class="hz-name">${HAZARD_NAMES[h.type] || esc(h.type)}</span><span class="lvl ${esc(h.level)}">${levelText(h.level)}</span></div>
            <p><b>Seen in image:</b> ${esc(h.evidence_image)}</p>
            <p><b>Data:</b> ${esc(h.evidence_data)}</p>
            <div class="conf">confidence: ${esc(h.confidence)}</div>
          </div>`).join('')}</div>`;
      }
      if (a.image_observations.length) html += `<div class="card reading-card"><h2>What ${r.readingSource === 'gemma' ? 'Gemma 4' : 'the AI'} sees in the image</h2><ul>${a.image_observations.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>`;
      if (a.actions.length) html += `<div class="card reading-card"><h2>Suggested next steps</h2><ul>${a.actions.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>`;
      if (a.data_gaps.length) html += `<div class="card reading-card"><h2>Uncertain / check on the ground</h2><ul>${a.data_gaps.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>`;

      html += '<div class="card"><h2>The data behind the reading</h2><table>';
      if (f) {
        html += `<tr><td>River flow today</td><td>${fmt(f.today_cms, ' m³/s')}</td></tr>
          <tr><td>14-day forecast peak</td><td>${fmt(f.forecast_peak_14d_cms, ' m³/s')} (${esc(f.forecast_peak_date)})</td></tr>
          <tr><td>≈ 2-year flood level</td><td>${fmt(f.approx_2yr_flood_cms, ' m³/s')}</td></tr>
          <tr><td>Peak ÷ 2-year flood</td><td>${fmt(f.peak_vs_2yr_flood)}</td></tr>`;
      }
      if (rv && rv.mean_discharge_cms !== undefined) {
        html += `<tr><td>Nearest major river</td><td>${fmt(rv.distance_km, ' km away')}</td></tr>
          <tr><td>Long-term mean flow</td><td>${fmt(rv.mean_discharge_cms, ' m³/s')}</td></tr>
          <tr><td>Upstream catchment</td><td>${fmt(rv.upstream_area_km2, ' km²')}</td></tr>
          <tr><td>Distance to sea / sink</td><td>${fmt(rv.distance_to_mouth_km, ' km')}</td></tr>`;
      }
      if (t) {
        html += `<tr><td>Elevation</td><td>${fmt(t.elevation_m, ' m')}</td></tr>
          <tr><td>Relief within 1 km</td><td>${fmt(t.relief_within_1km_m, ' m')}</td></tr>
          <tr><td>Steepest slope (~1 km)</td><td>${fmt(t.max_slope_deg, '°')}</td></tr>`;
      }
      if (rain) {
        html += `<tr><td>Rain, past 7 days</td><td>${fmt(rain.past_7_days_mm, ' mm')}</td></tr>
          <tr><td>Rain, next 3 days</td><td>${fmt(rain.next_3_days_mm, ' mm')}</td></tr>`;
      }
      const tl = d.tree_cover_loss;
      if (tl) {
        html += `<tr><td>Forest loss 2021-24 (~${tl.area_km2} km²)</td><td>${fmt(tl.total_2021_2024_ha, ' ha')}</td></tr>` +
          Object.entries(tl.natural_forest_loss_ha_by_year).map(([y, v]) => `<tr><td>&nbsp;&nbsp;${esc(y)}</td><td>${fmt(v, ' ha')}</td></tr>`).join('');
      }
      html += '</table>';
      const sources = [r.image?.source, f?.source, rv?.source, t?.source, rain?.source, d.soil?.source, tl?.source].filter(Boolean);
      html += `<div class="src">${sources.map(esc).join(' · ')}</div>`;
      if (r.missing?.length) html += `<div class="src">Not available this time: ${r.missing.map(esc).join(', ')}</div>`;
      html += '</div>';

      out.innerHTML = html;
      viewSwitch.hidden = false;
      document.getElementById('retry')?.addEventListener('click', () => lastPlace && assess(lastPlace.lat, lastPlace.lon, lastPlace.name));
    }
  </script>
</body>
</html>
